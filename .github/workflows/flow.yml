# Unified-flow checks for Wolfram itself. Other repos use the same reusable
# workflow with `uses: ewanc26/wolfram/.github/workflows/flow-reusable.yml@main`
# (see docs/flow.md). Here it is called locally and pinned to the PR's own
# commit, so a change to the checks is judged by the changed checks.
name: flow

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  flow:
    uses: ./.github/workflows/flow-reusable.yml
    with:
      canon_ref: ${{ github.event.pull_request.head.sha }}
