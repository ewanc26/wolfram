name: codex-clang-format
on:
  push:
    branches:
      - feat/oauth-node
jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Format OAuth node
        run: clang-format-18 -i src/node/oauth_node.c tools/oauth_node.c
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: oauth-node-formatted
          path: |
            src/node/oauth_node.c
            tools/oauth_node.c
