name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  oauth-node:
    name: Hosted OAuth node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OAuth node dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libcurl4-openssl-dev \
            libcjson-dev libmbedtls-dev libmicrohttpd-dev libssl-dev
      - name: Configure
        run: |
          cmake -S . -B build-oauth \
            -DWOLFRAM_BUILD_OAUTH_NODE=ON \
            -DWOLFRAM_BUILD_TESTS=OFF \
            -DWOLFRAM_BUILD_EXAMPLES=OFF \
            -DWOLFRAM_BUILD_TEST_HTTPD=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build OAuth node
        run: cmake --build build-oauth -j2 --target wolfram-oauth-node
  # Default build: core C23 library + CLI + unit tests. No optional modules.
  default:
    name: default build + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsecp256k1-dev

      - name: Clean build directory
        run: rm -rf build

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

  # libsecp256k1 is optional: the P-256 path stays available while k256 APIs
  # fail honestly at runtime. Keep that documented dependency boundary
  # buildable instead of exercising only hosts that installed every option.
  no-secp256k1:
    name: build without optional libsecp256k1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

  # Full-features build: server + store + store-crypto + C++ wrapper.
  # Also exercises the C++ lexicon generator test suite (CTest lexgen).
  full:
    name: full-features build + ctest + lexgen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsecp256k1-dev \
            libsodium-dev \
            libsqlite3-dev \
            libmicrohttpd-dev \
            libzstd-dev \
            libc-ares-dev

      - name: Clean build directory
        run: rm -rf build

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWOLFRAM_BUILD_SERVER=ON \
            -DWOLFRAM_BUILD_STORE=ON \
            -DWOLFRAM_BUILD_STORE_CRYPTO=ON \
            -DWOLFRAM_BUILD_CPP=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # examples_live (test/test_examples_live.c) is a gated live end-to-end
      # test: it SKIPs cleanly and ctest still passes when BSKY_HANDLE/
      # BSKY_PASSWORD are unset (a fork's CI, which has no access to repo
      # secrets, gets the same clean skip). When set, it logs in, posts, and
      # reads back through the real network -- against MetalBear's own dev
      # PDS (ewan.bear1.croft.click on bear1.croft.click, an app password
      # scoped to CI), not production Bluesky, so this doubles as a live
      # smoke test of that deployment on every push to main.
      - name: Test (ctest)
        env:
          BSKY_HANDLE: ${{ github.ref == 'refs/heads/main' && secrets.BSKY_HANDLE || '' }}
          BSKY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.BSKY_PASSWORD || '' }}
          BSKY_SERVICE: ${{ github.ref == 'refs/heads/main' && secrets.BSKY_SERVICE || '' }}
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

  # macOS: the full-features configuration, including relay_server and
  # sync_publish_server, which stand up a loopback HTTP server and drive a real
  # WebSocket handshake against it. Linux alone could not see the macOS-only
  # failures of those two tests (README.md). Dependencies come from Homebrew;
  # Apple's own libcurl is what a developer's Mac links, so the build prefers
  # the system one as a stock checkout would.
  macos:
    name: macOS full-features build + ctest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install cmake pkg-config libsodium libmicrohttpd zstd c-ares secp256k1 sqlite

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWOLFRAM_BUILD_SERVER=ON \
            -DWOLFRAM_BUILD_STORE=ON \
            -DWOLFRAM_BUILD_STORE_CRYPTO=ON \
            -DWOLFRAM_BUILD_CPP=ON

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(sysctl -n hw.ncpu)"

  # C# interop wrapper. Requires the .NET SDK; gated so the overall CI does
  # not fail when dotnet is unavailable. The wrapper P/Invokes the shared
  # libwolfram, so we build it as a shared library and point WOLFRAM_NATIVE_LIB
  # at the built .so.
  dotnet:
    name: C# interop (gated on dotnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsecp256k1-dev

      - name: Set up .NET SDK
        id: dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Check dotnet availability
        id: check
        run: |
          if command -v dotnet >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "dotnet not found — skipping C# interop job"
          fi

      - name: Clean build directory
        if: steps.check.outputs.available == 'true'
        run: rm -rf build

      - name: Build shared libwolfram
        if: steps.check.outputs.available == 'true'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=ON
          cmake --build build -j"$(nproc)"

      - name: Test C# interop
        if: steps.check.outputs.available == 'true'
        env:
          WOLFRAM_NATIVE_LIB: ${{ github.workspace }}/build/libwolfram.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/build:${{ github.workspace }}/build/_deps/cjson-build:${{ github.workspace }}/build/_deps/libcbor-build/src
        run: dotnet test dotnet/Wolfram.Interop.Tests/Wolfram.Interop.Tests.csproj

  # The Classic Mac OS 9 transport is a C89/CodeWarrior target, which no other
  # job here checks: the main builds compile it as part of nothing (it is a
  # separate, opt-in target) and would happily accept C99 constructs that
  # CodeWarrior rejects. macTLS is a third-party Open Transport/BearSSL library
  # that only builds for real PowerPC Mac OS 9, but its public header carries
  # plain-C fallback typedefs, so the transport compiles and links against
  # stubs on a Linux runner. That is enough to keep the dialect honest and to
  # run the transport's offline tests; it is not a substitute for a native
  # CodeWarrior build.
  macos9-transport:
    name: Mac OS 9 transport (C89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Enabling the transport configures the whole project too, so the usual
      # non-posix dependencies are still required; clang backs the dialect
      # check below. Deliberately no libsecp256k1-dev: the transport must not
      # depend on optional native crypto.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            clang

      - name: Fetch macTLS
        run: git clone --depth 1 https://github.com/mplsllc/macTLS.git /tmp/macTLS

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWOLFRAM_BUILD_MACOS9_TRANSPORT=ON \
            -DWOLFRAM_MACTLS_ROOT=/tmp/macTLS

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Assert the target really is compiled as strict C89
        run: |
          # Guards against the enforcement silently regressing: if the
          # -std=c90 flags disappear, the dialect checks below would still
          # pass and nothing would notice.
          FLAGS=build/CMakeFiles/wolfram-macos9-transport.dir/flags.make
          test -f "$FLAGS"
          grep -q -- '-std=c90' "$FLAGS"
          grep -q -- '-Wdeclaration-after-statement' "$FLAGS"

      - name: Recompile as strict C89 with every extension rejected
        run: |
          # Independent of CMake, and stricter than it: -pedantic-errors turns
          # GNU extensions and C99 constructs into hard errors, so this catches
          # anything the target's own flags let through.
          for f in src/transport/xrpc_mac9.c src/transport/macos9_tls.c src/update/update_core.c; do
            clang -std=c89 -pedantic-errors -Wall -Wextra \
              -Wno-unused-parameter -Werror \
              -Iinclude -I/tmp/macTLS/os9 \
              -DWOLFRAM_VERSION_MAJOR=0 -DWOLFRAM_VERSION_MINOR=26 \
              -DWOLFRAM_VERSION_PATCH=0 -DWOLFRAM_VERSION_STRING='"0.26.0"' \
              -c "$f" -o /dev/null
          done

      - name: Run the transport's offline tests
        run: ./build/test_macos9_transport

      - name: Run the full suite with the transport enabled
        run: ctest --test-dir build --output-on-failure

  # Formatting check: clang-format on changed lines only. The existing tree
  # predates this config and has not been mass-reformatted, so only
  # new/modified lines are required to conform — see .clang-format.
  format:
    name: clang-format (changed lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Determine diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting of changed files
        run: |
          BASE="${{ steps.base.outputs.ref }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable diff base (e.g. first commit on a new branch) — skipping."
            exit 0
          fi
          # Per-file --dry-run --Werror rather than git-clang-format: that
          # wrapper unconditionally calls `clang-format -list-ignored`
          # (added in newer LLVM releases), which crashes silently under
          # `set -e` against an apt-installed clang-format that predates it,
          # failing the job with no diagnostic. The whole tree is fully
          # clang-format-clean as of the repo-wide reformat, so checking a
          # changed file in full is equivalent to checking just its changed
          # lines and needs no wrapper script at all. The version is pinned
          # to clang-format-18 because ubuntu-latest's unpinned clang-format
          # drifts: a newer one re-flags pre-existing lines in files that only
          # picked up a small edit, failing CI on content nobody touched.
          CHANGED="$(git diff --name-only --diff-filter=d "$BASE" -- '*.c' '*.h' '*.cpp' '*.hpp' '*.cc')"
          if [ -z "$CHANGED" ]; then
            echo "No C/C++ files changed."
            exit 0
          fi
          echo "Checking: $CHANGED"
          FAIL=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            clang-format-18 --dry-run --Werror -style=file "$f" || FAIL=1
          done <<< "$CHANGED"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more changed files are not clang-format clean (see errors above). Run: clang-format -i <file>, review, and commit the result."
            exit 1
          fi

      - name: Check CMake formatting (informational)
        continue-on-error: true
        run: |
          pip install --quiet cmakelang
          cmake-format --check CMakeLists.txt || echo "::warning::CMakeLists.txt is not cmake-format clean yet (non-blocking until the tree is reformatted)."

  # The flow checks are scripts, and a script that cannot fail checks nothing.
  # The self-test feeds each rule a violation and requires it to be refused.
  flow-scripts:
    name: flow scripts self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/flow-selftest.sh
      - run: tools/style-selftest.sh
      - run: tools/embedded-check.sh
      - run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
      - run: tools/repo-sync-selftest.sh

  # One name for branch protection to require. It fails when any gating job
  # failed or was cancelled, so a new job is covered by adding it to `needs`
  # here instead of editing repository settings. The desloppify scan is
  # informational and deliberately not listed.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - oauth-node
      - default
      - no-secp256k1
      - full
      - dotnet
      - macos9-transport
      - format
      - flow-scripts
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a gating job finished as '$r'"; exit 1; }
          done

  # Mechanical codebase-health scan (desloppify). Informational only: its
  # score is 75% subjective design review, which needs an LLM in the loop
  # that this workflow doesn't run — so this surfaces the objective/mechanical
  # signal (duplication, dead code, unused imports, security smells) rather
  # than gating merges on an unreviewed score.
  desloppify-scan:
    name: desloppify (mechanical scan, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run mechanical scan
        run: |
          uvx --from git+https://github.com/peteromallet/desloppify.git desloppify scan --path .
          uvx --from git+https://github.com/peteromallet/desloppify.git desloppify status
