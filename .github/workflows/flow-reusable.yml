# Reusable: the unified-flow checks. Wolfram hosts the canonical copy; the
# other repos call it from a three-line .github/workflows/flow.yml. See
# docs/flow.md.
name: flow-reusable

on:
  workflow_call:
    inputs:
      canon_ref:
        description: Ref of ewanc26/wolfram to take the scripts and canonical files from.
        type: string
        default: main
      macos9_c89:
        description: Run the Classic Mac OS 9 C90 check of Wolfram's transport sources. Repos that ship no Mac OS 9 code can turn it off.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch canonical flow
        uses: actions/checkout@v7
        with:
          repository: ewanc26/wolfram
          ref: ${{ inputs.canon_ref }}
          path: .flow-canon
      - name: Check branch, title, body and commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .flow-canon/tools/flow-check.sh

  style:
    name: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch canonical flow
        uses: actions/checkout@v7
        with:
          repository: ewanc26/wolfram
          ref: ${{ inputs.canon_ref }}
          path: .flow-canon
      - name: Check README header and logo against docs/house-style.md
        run: bash .flow-canon/tools/style-check.sh .

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch canonical flow
        uses: actions/checkout@v7
        with:
          repository: ewanc26/wolfram
          ref: ${{ inputs.canon_ref }}
          path: .flow-canon
      - name: Unreleased is updated by any change outside docs/CI/tests
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .flow-canon/tools/changelog-check.py pr "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Every tag has a section and every section a tag
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          allow=""
          case "$HEAD_REF" in release/v*) allow="--allow-untagged ${HEAD_REF#release/v}" ;; esac
          python3 .flow-canon/tools/changelog-check.py drift . $allow

  repo-config:
    name: labels and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch canonical flow
        uses: actions/checkout@v7
        with:
          repository: ewanc26/wolfram
          ref: ${{ inputs.canon_ref }}
          path: .flow-canon
      - name: Install PyYAML
        run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
      - name: Labels match labels.yml and Wolfram's core
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .flow-canon/tools/repo_sync.py labels check --repo "${{ github.repository }}" --canon .flow-canon/.github/labels.yml
      - name: Issue forms match Wolfram's, apart from the area options
        run: python3 .flow-canon/tools/repo_sync.py forms check --repo "${{ github.repository }}" --canon .flow-canon/.github/ISSUE_TEMPLATE
      - name: Metadata matches repo-metadata.yml and Wolfram's core
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .flow-canon/tools/repo_sync.py metadata check --repo "${{ github.repository }}" --canon .flow-canon/.github/repo-metadata.yml

  drift:
    name: drift
    # Wolfram is the canonical copy; there is nothing to drift from.
    if: github.repository != 'ewanc26/wolfram'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch canonical flow
        uses: actions/checkout@v7
        with:
          repository: ewanc26/wolfram
          ref: ${{ inputs.canon_ref }}
          path: .flow-canon
      - name: Compare with the canonical copy
        run: bash .flow-canon/tools/flow-drift.sh .flow-canon .

  macos9-c89:
    name: macos9-c89
    if: inputs.macos9_c89
    # The Classic Mac OS 9 transport's C90 flags, checked on every caller. The
    # check reads the canonical copy, so it runs the same on every repo.
    runs-on: ubuntu-latest
    steps:
      - name: Fetch canonical flow
        uses: actions/checkout@v7
        with:
          repository: ewanc26/wolfram
          ref: ${{ inputs.canon_ref }}
          path: .flow-canon
      - name: Install clang and gcc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang gcc
      - name: Compile the Mac OS 9 transport sources under C90
        working-directory: .flow-canon
        run: bash tools/macos9-c89-check.sh
